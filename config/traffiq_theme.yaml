# traffiQ-Farbspektrum – einzige Quelle für Farben der Oberfläche.
# Der Server erzeugt daraus /theme.css (CSS-Variablen); JavaScript liest die Werte aus diesen Variablen.
# Im Code stehen keine Farbwerte. Werte mit „Vorschlag“ sind aus dem Spektrum abgeleitet und
# von traffiQ zu bestätigen.

name: "traffiQ Frankfurt am Main"

logo:
  text: "traffiQ"
  zusatz: "Frankfurt am Main"
  datei: "static/logo/traffiq_logo.png"   # Logo aus dem traffiQ-Briefbogen (transparent, 800 × 304 px); fehlt die Datei, erscheint das Textlogo

schrift:
  familie: "Arial, Helvetica, sans-serif"  # Hausschrift laut traffiQ-Briefbogen: Arial
  groesse_fliesstext_px: 16
  # Kartenlabels: MapLibre braucht die Schrift als Glyphen-Dateien. Sie werden lokal aus der ersten
  # vorhandenen Schriftdatei erzeugt (Arial; sonst das metrisch gleiche Liberation Sans).
  karte_regular: "Arial Regular"
  karte_fett: "Arial Bold"
  karte_dateien:
    "Arial Regular": [arial.ttf, Arial.ttf, LiberationSans-Regular.ttf, Arimo-Regular.ttf]
    "Arial Bold": [arialbd.ttf, "Arial Bold.ttf", LiberationSans-Bold.ttf, Arimo-Bold.ttf]

basis:
  text: "#162a6b"
  hintergrund: "#ffffff"
  hintergrund_sekundaer: "#f3f4f6"

akzent:
  gruen: "#009c84"        # nur Flächen, Linien, Symbole, Rahmen – nie Textfarbe, kein kleiner Text darauf
  hellblau: "#009ee2"     # nur Flächen, Linien, Symbole, Rahmen – nie Textfarbe, kein kleiner Text darauf
  rot: "#e30613"          # nur Warnungen und ausgeschlossene Flächen, immer mit Text
  grau: "#90969a"         # Linien und Rahmen, keine Textfarbe

focus_ring: "#009ee2"

map_layers:
  bestand_pr: "#162a6b"
  oepnv_schiene: "#009c84"
  oepnv_bus: "#009ee2"
  strasse_autobahn: "#90969a"   # Vorschlag: dick gezeichnet, ruhiger als Dunkelblau
  strasse_haupt: "#90969a"
  strasse_neben: "#90969a"      # Vorschlag: dünn und halbtransparent
  radnetz: "#009ee2"            # Vorschlag: gestrichelt, unterscheidet sich so vom Bus
  kandidat: "#009ee2"           # Vorschlag
  zwischennutzung: "#009c84"    # Vorschlag: gestrichelter Rand
  schutzgebiet: "#009c84"       # Vorschlag: Schraffur
  ausschluss: "#e30613"

# Stadtkarte (Protomaps-Basiskarte) – Stil in app/static/map/style-stadt.json verweist auf diese Werte.
basiskarte:
  land: "#f3f4f6"
  wasser: "#99d8f3"
  gruen: "#99d7ce"              # Wald und Parks
  gruen_deckkraft: 0.45         # nur sehr hell
  gebaeude: "#c8cbcd"           # ohne Umrandung
  strasse_gross: "#6f7478"      # Vorschlag: Autobahn und Bundesstraße, dunkler Grauton aus dem Grau abgeleitet
  strasse_klein: "#ffffff"      # Nebenstraßen weiß …
  strasse_kontur: "#90969a"     # … mit feiner grauer Kontur
  bahn: "#90969a"               # gestrichelt
  grenze: "#90969a"             # Stadt- und Kreisgrenzen, fein
  label: "#162a6b"
  label_halo: "#ffffff"
  ort_buchstabenabstand_em: 0.12
  schematisch_grund: "#ffffff"  # Kartenstil „Schematisch“: neutraler Grund

status:
  geprueft: "#009c84"
  plausibel: "#009ee2"
  hinweis: "#90969a"
  ausgeschlossen: "#e30613"

ampel:
  # Auslastung; immer zusammen mit Symbol und Text. Das Spektrum enthält kein Gelb.
  frei: "#009c84"
  knapp: "#162a6b"              # Vorschlag
  voll: "#e30613"

chart_series: ["#162a6b", "#009c84", "#009ee2", "#90969a"]
chart_alert: "#e30613"

# Hellere Tönungen für Hinterlegungen entstehen in CSS mit color-mix aus diesen Farben.
toenung_anteil: 0.12

# Textpaare, die der Test auf WCAG AA (4,5:1) prüft: [Textfarbe, Hintergrund]
# Pfade verweisen auf Schlüssel dieser Datei; "toenung:<pfad>" ist die helle Tönung einer Farbe.
textpaare:
  - [basis.text, basis.hintergrund]
  - [basis.text, basis.hintergrund_sekundaer]
  - [basis.hintergrund, basis.text]
  - [basis.text, "toenung:akzent.gruen"]
  - [basis.text, "toenung:akzent.hellblau"]
  - [basis.text, "toenung:akzent.rot"]
  - [basis.text, "toenung:akzent.grau"]
  - [akzent.rot, basis.hintergrund]
  - ["sekundaertext", basis.hintergrund]
  - ["sekundaertext", basis.hintergrund_sekundaer]
  # Kartenlabels: immer Dunkelblau mit weißem Halo; die Paare gelten auch ohne Halo auf den Kartenflächen
  - [basiskarte.label, basiskarte.label_halo]
  - [basiskarte.label, basiskarte.land]
  - [basiskarte.label, basiskarte.wasser]
  - [basiskarte.label, "basiskarte-gruen"]
  - [basiskarte.label, basiskarte.gebaeude]
sekundaertext_anteil: 0.75        # Sekundärtext = Textfarbe 75 % + Hintergrund 25 %
