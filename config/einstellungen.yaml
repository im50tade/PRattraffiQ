# Zentrale Konfiguration „P+R Flächenfinder Rhein-Main“
# Gewichte, Schwellenwerte, Emissionsfaktor, Verlagerungsanteil, Abschreibungsdauer und Region.
# Änderungen wirken nach einem Neustart des Servers.

# ============================================================================ Region
region:
  aktiv: frankfurt                    # Schlüssel aus "regionen"
  regionen:
    frankfurt:
      label: "Pilotraum Frankfurt am Main"
      datenverzeichnis: "data/frankfurt"
      testdaten: true                 # blendet im UI den Hinweis „Testdaten“ ein
      karte: {mitte: [50.115, 8.680], zoom: 11}
      # Gemeindeliste mit amtlichem Gemeindeschlüssel (AGS) – vor produktiver Nutzung mit dem Gemeindeverzeichnis
      # des Hessischen Statistischen Landesamts abgleichen; dient zum Filtern
      # von Pendlerstatistik, Zählstellen und Kataster beim Wechsel auf echte Daten
      gemeinden:
        - {name: "Frankfurt am Main", ags: "06412000", rolle: "Pilotstadt"}
        - {name: "Offenbach am Main", ags: "06413000", rolle: "Referenzort"}
        - {name: "Bad Homburg v. d. Höhe", ags: "06434001", rolle: "Referenzort"}
        - {name: "Oberursel (Taunus)", ags: "06434008", rolle: "Referenzort"}
        - {name: "Hanau", ags: "06415000", rolle: "Referenzort"}   # kreisfrei seit 2026, vorher 06435014
        - {name: "Eschborn", ags: "06436003", rolle: "Referenzort"}
        - {name: "Neu-Isenburg", ags: "06438009", rolle: "Referenzort"}
      kreise: []
    rhein_main:
      label: "Metropolregion Frankfurt/Rhein-Main (Erweiterung)"
      datenverzeichnis: "data/rhein_main"   # noch nicht befüllt; gleiche Layer-Struktur wie data/frankfurt
      testdaten: false
      karte: {mitte: [50.10, 8.65], zoom: 9}
      gemeinden:                      # kreisfreie Städte und einzelne Gemeinden außerhalb der Kreisliste
        - {name: "Frankfurt am Main", ags: "06412000", rolle: "Kernstadt"}
        - {name: "Offenbach am Main", ags: "06413000", rolle: "kreisfreie Stadt"}
        - {name: "Hanau", ags: "06415000", rolle: "kreisfreie Stadt (seit 2026 nicht mehr im Main-Kinzig-Kreis)"}
        - {name: "Darmstadt", ags: "06411000", rolle: "kreisfreie Stadt"}
        - {name: "Wiesbaden", ags: "06414000", rolle: "kreisfreie Stadt"}
      kreise:                         # Erweiterung über Kreisliste: alle Gemeinden dieser Kreise
        - {name: "Main-Taunus-Kreis", schluessel: "06436"}
        - {name: "Hochtaunuskreis", schluessel: "06434"}
        - {name: "Main-Kinzig-Kreis", schluessel: "06435"}
        - {name: "Kreis Offenbach", schluessel: "06438"}
        - {name: "Wetteraukreis", schluessel: "06440"}
        - {name: "Kreis Groß-Gerau", schluessel: "06433"}

# ============================================================================ Flächenfinder
bewertung:
  raeumliche_parameter:
    crs_metrisch: "EPSG:25832"          # ETRS89 / UTM 32N, für Distanzen und Flächen in Metern
    einzugsradius_achse_m: 3000         # Einpendler einer Achse zählen linear abnehmend bis zu diesem Abstand
    max_zufahrtsdistanz_m: 1500        # Verkehrsmenge zählt, wenn die Achse (inkl. Zubringer) höchstens so weit entfernt ist
    oev_radius_m: 800                   # S-Bahn-Stationen im Fußwegradius (ca. 10 Minuten)
    flaechenbedarf_je_stellplatz_m2: 25 # inkl. Fahrgassen
    nutzbarer_flaechenanteil: 0.85      # Abzug für Zufahrt, Grün, Nebenanlagen

  nachfragemodell:
    # korridor: Pendlerströme Herkunftsgemeinde → Zentrum (Layer "pendlerquellen"); die Fläche muss auf dem Weg liegen
    # achse:    Einpendler der nächstgelegenen Einfallachse, linear abnehmend bis "einzugsradius_achse_m"
    verfahren: korridor
    korridorbreite_m: 3000            # bis zu diesem Abstand von der Luftlinie Gemeinde–Zentrum zählt der Strom (linear abnehmend)
    min_lage_anteil: 0.0              # 0 = Fläche direkt am Wohnort zählt mit
    max_lage_anteil: 0.85             # im letzten Streckenabschnitt vor dem Zentrum werden kaum noch Pkw-Fahrten abgefangen

  ausschluss:
    # Je Gebietstyp: ko_ab_anteil = Ausschluss ab diesem Flächenanteil (0.0 = jede Überlappung),
    # hinweis_ab_anteil = unterhalb der K.-o.-Schwelle Prüfhinweis, die Fläche bleibt im Ranking.
    gebietstypen:
      schutzgebiet:
        label: "Schutzgebiet"
        ko_ab_anteil: 0.0
      ueberschwemmungsgebiet:
        label: "Überschwemmungsgebiet"
        ko_ab_anteil: 0.10            # kleine Randüberlappungen lassen sich durch die Anordnung der Stellplätze meiden
        hinweis_ab_anteil: 0.0
      wasserschutzgebiet_zone_1_2:    # für echte Daten (HLNUG) vorbereitet, in den Testdaten nicht enthalten
        label: "Wasserschutzgebiet Zone I/II"
        ko_ab_anteil: 0.0
      wasserschutzgebiet_zone_3:
        label: "Wasserschutzgebiet Zone III"
        hinweis_ab_anteil: 0.0
      altlastenverdacht:              # Kandidaten-Pipeline und Zwischennutzung
        label: "Altlastenverdachtsfläche"
        ko_ab_anteil: 0.0
      bahnanlage:                     # Bahnanlage einschließlich Sicherheitsabstand (kandidaten.bahn_sicherheitsabstand_m)
        label: "Bahnanlage mit Sicherheitsabstand"
        ko_ab_anteil: 0.0

  indikatoren:
    nachfrage:
      label: "Nachfragepotenzial"
      beschreibung: "Einpendler, deren Weg ins Zentrum an der Fläche vorbeiführt (Korridormodell, siehe nachfragemodell)"
      komponenten:
        einpendler_einzugsbereich:
          label: "Einpendler im Einzugsbereich"
          einheit: "Personen/Tag"
          min: 2000
          max: 25000
          anteil: 1.0
    miv:
      label: "MIV-Bezug"
      beschreibung: "Verkehrsmenge (DTV) der nächstgelegenen Einfallachse an der Zufahrt"
      komponenten:
        dtv_zufahrt:
          label: "Verkehrsmenge an der Zufahrt"
          einheit: "Kfz/24 h"
          min: 20000
          max: 100000
          anteil: 1.0
    oev:
      label: "ÖV-Umsteigequalität"
      beschreibung: "Abfahrten je Stunde aller S-Bahn-Stationen im Fußwegradius (Linienanzahl × 60 / Takt)"
      komponenten:
        oev_abfahrten_je_stunde:
          label: "ÖV-Abfahrten im Fußwegradius"
          einheit: "Abfahrten/h"
          min: 0
          max: 12
          anteil: 1.0
    erreichbarkeit:
      label: "Erreichbarkeit Rad/Fuß/Sharing"
      beschreibung: "Distanz zum nächsten Radweg und zur nächsten Sharing-Station (je näher, desto besser)"
      komponenten:
        distanz_radweg_m:
          label: "Distanz zum Radweg"
          einheit: "m"
          min: 0
          max: 800
          invertiert: true
          anteil: 0.5
        distanz_sharing_m:
          label: "Distanz zur Sharing-Station"
          einheit: "m"
          min: 0
          max: 3000
          invertiert: true
          anteil: 0.5
    flaeche:
      label: "Flächenverfügbarkeit und -eignung"
      beschreibung: "Größe der Fläche und Eigentum (öffentliche Flächen sind schneller verfügbar)"
      komponenten:
        flaeche_m2:
          label: "Flächengröße"
          einheit: "m²"
          min: 2000
          max: 15000
          anteil: 0.6
        eigentum:
          label: "Eigentum"
          einheit: ""
          kategorien:
            öffentlich: 100
            privat: 30
            ungeklärt: 50             # Eigentum nicht aus Quelldaten bekannt (Kandidaten-Pipeline)
          anteil: 0.4
    kosten:
      label: "Kosten"
      beschreibung: "Geschätzte Investition je Stellplatz (je niedriger, desto besser)"
      komponenten:
        investition_je_stellplatz_eur:
          label: "Investition je Stellplatz"
          einheit: "€"
          min: 3000
          max: 25000
          invertiert: true
          anteil: 1.0
    umwelt:
      label: "Umwelt und Städtebau"
      beschreibung: "Bereits versiegelte Flächen vermeiden Neuversiegelung; naturnahe Flächen werden geschont"
      komponenten:
        versiegelungsgrad_prozent:
          label: "Versiegelungsgrad (Bestand)"
          einheit: "%"
          min: 0
          max: 100
          anteil: 0.5
        naturnaehe_prozent:
          label: "Naturnähe"
          einheit: "%"
          min: 0
          max: 100
          invertiert: true
          anteil: 0.5

  profile:
    ausgewogen:
      label: "Ausgewogen"
      beschreibung: "Standardgewichtung über alle Kriterien"
      gewichte: {nachfrage: 20, miv: 15, oev: 15, erreichbarkeit: 10, flaeche: 15, kosten: 15, umwelt: 10}
    klimaschutz:
      label: "Klimaschutz"
      beschreibung: "Betont gute ÖV-Anbindung, Rad- und Sharing-Erreichbarkeit sowie Flächenschonung"
      gewichte: {nachfrage: 20, miv: 10, oev: 25, erreichbarkeit: 15, flaeche: 10, kosten: 5, umwelt: 15}
    kosten:
      label: "Kosten"
      beschreibung: "Betont geringe Investition und schnell verfügbare Flächen"
      gewichte: {nachfrage: 15, miv: 15, oev: 10, erreichbarkeit: 5, flaeche: 20, kosten: 30, umwelt: 5}
    stadtvertraeglichkeit:
      label: "Stadtverträglichkeit"
      beschreibung: "Betont Umwelt, Städtebau und Erreichbarkeit ohne Auto"
      gewichte: {nachfrage: 15, miv: 10, oev: 15, erreichbarkeit: 15, flaeche: 10, kosten: 10, umwelt: 25}

  kostenbandbreite:
    # Faktoren auf die geschätzte Investition je Stellplatz
    konservativ: 1.30
    realistisch: 1.00
    optimistisch: 0.80

  sharing_regeln:
    # Eine Empfehlung gilt, wenn alle Bedingungen erfüllt sind.
    # Verfügbare Kennwerte: siehe Steckbrief (Rohwerte, stellplaetze, distanz_zentrum_m).
    bike_hub:
      label: "Bike-Hub"
      nutzen: "Sichere Radabstellanlage mit Bike-Sharing für den Umstieg Rad ↔ ÖV"
      bedingungen:
        - {kennwert: distanz_radweg_m, operator: "<=", wert: 300}
        - {kennwert: oev_abfahrten_je_stunde, operator: ">=", wert: 4}
    e_scooter_zone:
      label: "E-Scooter-Zone"
      nutzen: "Abstellzone für E-Scooter auf der letzten Meile Richtung Zentrum"
      bedingungen:
        - {kennwert: distanz_zentrum_m, operator: "<=", wert: 9000}
        - {kennwert: oev_abfahrten_je_stunde, operator: ">=", wert: 2}
    carsharing:
      label: "Carsharing"
      nutzen: "Carsharing-Stellplätze für Zweitwege und als Ergänzung für Pendelnde ohne eigenes Auto"
      bedingungen:
        - {kennwert: stellplaetze, operator: ">=", wert: 150}
        - {kennwert: einpendler_einzugsbereich, operator: ">=", wert: 10000}
    e_lastenrad:
      label: "E-Lastenrad"
      nutzen: "E-Lastenräder für Einkaufs- und Transportwege in die Innenstadt"
      bedingungen:
        - {kennwert: distanz_zentrum_m, operator: "<=", wert: 6000}
        - {kennwert: distanz_radweg_m, operator: "<=", wert: 400}
    ladepunkte:
      label: "Ladepunkte"
      nutzen: "Ladepunkte für E-Pkw (Richtwert 10 % der Stellplätze)"
      anteil_stellplaetze: 0.10
      bedingungen:
        - {kennwert: stellplaetze, operator: ">=", wert: 80}

# ============================================================================ Live-Monitoring und Wirkung
monitoring:
  datenquelle: simulator              # simulator | sensor | parkautomat | gbfs (nur simulator ist implementiert)

  aktualisierung:
    intervall_s: 5                    # Abstand der Aktualisierungen in echten Sekunden
    zeitraffer: 1                     # 1 = Echtzeit; 60 = eine echte Sekunde entspricht einer simulierten Minute
    zeitraffer_optionen: [1, 60, 360, 1440]

  historie:
    vorlauf_tage: 8                   # beim Start simulierte Vergangenheit (für Wochenansicht)
    aufbewahrung_tage: 21             # ältere Daten werden aus dem Speicher entfernt
    bucket_minuten: 5                 # Zeitraster der gespeicherten Messwerte
    csv_datei: "data/historie/messwerte.csv"  # Ziel für den CSV-Export

  ampel:
    gruen_bis: 0.70                   # Auslastung unter 70 % = grün
    gelb_bis: 0.90                    # 70–90 % = gelb, darüber rot

  wirtschaftlichkeit:
    abschreibungsdauer_jahre: 20
    kapitalzins: 0.03                 # kalkulatorischer Zinssatz auf das durchschnittlich gebundene Kapital
    tage_je_jahr: 365                 # Hochrechnung der Tageswerte (Ø der letzten 7 Tage) auf ein Jahr

  wirkung:
    verlagerungsanteil: 0.30          # Anteil der P+R-Nutzer, die ohne P+R mit dem Pkw ins Zentrum gefahren wären
    emissionsfaktor_g_je_km: 150      # CO₂-Äquivalente je Pkw-Kilometer (Annahme, Pkw-Bestandsmix)
    querschnittsfahrten_je_verlagerter_fahrt: 2   # Hin- und Rückweg passieren die Zählstelle
    befragungen_datei: "data/befragungen.json"   # eingegebene Befragungsergebnisse (nur aggregierte Anteile)

  simulator:
    zufallssaat: 42
    schrittweite_min: 5               # interne Rechenschrittweite
    kurzparker_je_stellplatz_und_stunde: 0.015   # zusätzlicher Umschlag tagsüber (Kurzzeitparken)
    wochenendfaktor: {samstag: 0.35, sonntag: 0.20}
    schwankung: 0.06                  # relative Zufallsschwankung der Belegung
    wetter:
      # Faktor auf P+R-Belegung und Sharing-Nutzung; Wahrscheinlichkeit für automatische Tageswahl
      sonnig:   {label: "Sonnig",   pr_faktor: 0.97, sharing_faktor: 1.15, wahrscheinlichkeit: 0.35}
      bewoelkt: {label: "Bewölkt",  pr_faktor: 1.00, sharing_faktor: 1.00, wahrscheinlichkeit: 0.35}
      regen:    {label: "Regen",    pr_faktor: 1.08, sharing_faktor: 0.55, wahrscheinlichkeit: 0.25}
      schnee:   {label: "Schnee",   pr_faktor: 0.92, sharing_faktor: 0.30, wahrscheinlichkeit: 0.15, monate: [12, 1, 2]}

  sharing:
    # Grundnachfrage (Fahrten je Fahrzeug und Werktag) und mittlere Nutzungsdauer je Fahrt
    bike:       {label: "Bike-Sharing",  fahrten_je_fahrzeug_tag: 3.0, mittlere_dauer_min: 22}
    escooter:   {label: "E-Scooter",     fahrten_je_fahrzeug_tag: 4.0, mittlere_dauer_min: 12}
    carsharing: {label: "Carsharing",    fahrten_je_fahrzeug_tag: 1.4, mittlere_dauer_min: 150}
    lastenrad:  {label: "E-Lastenrad",   fahrten_je_fahrzeug_tag: 1.0, mittlere_dauer_min: 75}

  wirkungsdaten:
    # Synthetische Zählreihen für den Vorher-Nachher-Vergleich (nur Werktage)
    vorher_tage: 60                   # Kalendertage vor Eröffnung
    max_nachher_tage: 180             # höchstens so viele Kalendertage nach Eröffnung
    hochlauf_tage: 45                 # Zeitkonstante, bis sich die Nutzung eingespielt hat

# ============================================================================ Datenquellen (Erweiterung Bestand, Netz, Kandidaten)
quellen:
  # Echte Daten werden hier abgelegt (relativ zum Projekt). Fehlende Dateien sind erlaubt;
  # der Datenlage-Bericht weist sie aus. Testdaten liegen getrennt und werden nie mit echten vermischt.
  echt_verzeichnis: "data/quellen"
  test_verzeichnis: "data/frankfurt/quellen_test"
  dateien:
    osm: "osm/region.overpass.json"           # Overpass-JSON (scripts/hole_osm.py) – P+R, Straßen, Radnetz, Freiflächen, Bahn
    gtfs: "gtfs/gtfs.zip"                      # GTFS-Feed als ZIP oder entpacktes Verzeichnis "gtfs/"
    kommunal_pr: "kommunal/pr_anlagen.csv"     # alternativ .geojson; Felder Name, Adresse, Stellplätze, Betreiber, Status, lat, lon
    liegenschaften: "kommunal/liegenschaften.geojson"   # Eigentum, Baurecht, Nutzung bestätigt, Strom, Wasser
    bauleitplanung: "kommunal/bauleitplanung.geojson"   # Entwicklungsabsicht, Entwicklung ab (Jahr), Verfahren
    schutzgebiete: "umwelt/schutzgebiete.geojson"       # typ wie bewertung.ausschluss.gebietstypen
    wasserschutz: "umwelt/wasserschutz.geojson"
    altlasten: "umwelt/altlasten.geojson"
    neigung: "umwelt/neigung.geojson"                   # Rasterzellen mit neigung_prozent
    zaehlstellen: "zaehlung/zaehlstellen.csv"           # id, name, lat, lon, dtv_kfz
    pendlerquellen: "region/pendlerquellen.geojson"     # Herkunftsgemeinden mit Einpendlern (Korridormodell)
    einfallachsen: "region/einfallachsen.geojson"       # Achsen mit dtv_kfz
    sharing_stationen: "region/sharing_stationen.geojson"
    stadtgebiet: "region/stadtgebiet.geojson"           # Stadtgrenze und Zentrum
  testdaten_anzeigen: true                              # Standard des Schalters „Testdaten anzeigen“

bestand:
  zusammenfuehrung_m: 30            # OSM- und kommunale Anlage gelten bis zu diesem Abstand als dieselbe Anlage
  abweichung_stellplaetze_anteil: 0.10   # ab 10 % Differenz der Stellplätze wird eine Abweichung markiert
  haltestellen_im_umkreis_m: 800

netz:
  stichtag_wochentag: "dienstag"    # Werktag, an dem Fahrten aus dem GTFS gezählt werden
  tageszeiten:
    hvz_frueh: {label: "Hauptverkehrszeit früh (6–9 Uhr)", von: 6, bis: 9}
    nvz: {label: "Normalverkehrszeit (9–15 Uhr)", von: 9, bis: 15}
    hvz_spaet: {label: "Hauptverkehrszeit spät (15–19 Uhr)", von: 15, bis: 19}
    svz: {label: "Schwachverkehrszeit (19–23 Uhr)", von: 19, bis: 23}
  standard_tageszeit: hvz_frueh
  strassen_mindestzoom:             # maßstabsabhängige Darstellung (Generalisierung)
    Autobahn: 0
    Bundesstraße: 0
    Hauptstraße: 11
    Nebenstraße: 13
  zaehlstelle_zuordnung_m: 60       # Zählstelle wird dem nächsten Straßenabschnitt bis zu diesem Abstand zugeordnet

kandidaten:
  mindestflaeche_m2: 2000
  max_neigung_prozent: 6
  max_haltestellendistanz_m: 800
  parkplatz_mindestflaeche_m2: 5000          # "große" amenity=parking
  bahn_sicherheitsabstand_m: 20
  osm_typen:
    # landuse bzw. amenity → Annahmen für Versiegelung, Naturnähe, Investition und Befestigung
    brownfield:   {label: "Brache", versiegelung: 70, naturnaehe: 10, investition_je_stellplatz: 4500, befestigung: "teilbefestigt", status_ohne_liegenschaft: plausibel}
    construction: {label: "Baufeld", versiegelung: 50, naturnaehe: 5, investition_je_stellplatz: 5000, befestigung: "teilbefestigt", status_ohne_liegenschaft: plausibel}
    parking:      {label: "Großparkplatz", versiegelung: 100, naturnaehe: 0, investition_je_stellplatz: 3000, befestigung: "befestigt", status_ohne_liegenschaft: plausibel}
    greenfield:   {label: "Grünland (Bauerwartung)", versiegelung: 0, naturnaehe: 60, investition_je_stellplatz: 6500, befestigung: "unbefestigt", status_ohne_liegenschaft: hinweis}
    vacant:       {label: "Freifläche ungenutzt", versiegelung: 30, naturnaehe: 30, investition_je_stellplatz: 5500, befestigung: "unbefestigt", status_ohne_liegenschaft: hinweis}

zwischennutzung:
  max_zeitrahmen_jahre: 5
  gewichte: {zeithorizont: 20, erschliessung: 20, bodenzustand: 15, lage: 15, nutzungskonflikte: 15, rueckbaubarkeit: 5, kosten: 10}
  schwellen:
    zeithorizont_jahre: {min: 0.5, max: 5}              # verfügbare Jahre bis zur geplanten Entwicklung
    zufahrt_m: {min: 0, max: 300, invertiert: true}      # Abstand zur nächsten Straße
    oev_abfahrten_je_stunde: {min: 0, max: 12}
    distanz_achse_m: {min: 0, max: 3000, invertiert: true}
    konfliktabstand_m: {min: 0, max: 300}                # Abstand zu Wohnen, Schule, Kita, Schutzgrün
    kosten_je_stellplatz_eur: {min: 200, max: 3000, invertiert: true}
  befestigung:
    # Herrichtungskosten je Stellplatz und Rückbaubarkeit (0–100) nach Ausgangszustand
    befestigt:     {kosten_je_stellplatz: 300, rueckbaubarkeit: 100, punkte: 100}
    teilbefestigt: {kosten_je_stellplatz: 1200, rueckbaubarkeit: 70, punkte: 60}
    unbefestigt:   {kosten_je_stellplatz: 2500, rueckbaubarkeit: 30, punkte: 20}
  unbekannt_punkte: 50              # Teilbewertung, wenn eine Information fehlt (wird im Steckbrief ausgewiesen)
  kostenbandbreite: {konservativ: 1.4, realistisch: 1.0, optimistisch: 0.75}
  typen:
    # Reihenfolge = Priorität; der erste Typ, dessen Bedingungen alle erfüllt sind, wird empfohlen
    baustellenlogistik:
      label: "Baustellenlogistik"
      nutzen: "Lager- und Logistikfläche für die anstehende Bebauung der Fläche oder ihres Umfelds"
      bedingungen:
        - {kennwert: jahre_bis_entwicklung, operator: "<=", wert: 1.5}
        - {kennwert: zufahrt_m, operator: "<=", wert: 100}
    pr_provisorium:
      label: "P+R-Provisorium"
      nutzen: "Temporäre P+R-Anlage bis zur endgültigen Nutzung"
      bedingungen:
        - {kennwert: flaeche_m2, operator: ">=", wert: 3000}
        - {kennwert: distanz_achse_m, operator: "<=", wert: 2000}
        - {kennwert: oev_abfahrten_je_stunde, operator: ">=", wert: 4}
    mobilitaetsstation:
      label: "Mobilitätsstation"
      nutzen: "Sharing, Fahrradparken und Ladepunkte an einem gut angebundenen Haltepunkt"
      bedingungen:
        - {kennwert: oev_abfahrten_je_stunde, operator: ">=", wert: 6}
    sharing_hub:
      label: "Sharing-Hub"
      nutzen: "Abstellfläche für Bike-, E-Scooter- und Carsharing-Flotten"
      bedingungen:
        - {kennwert: flaeche_m2, operator: ">=", wert: 0}

review:
  datei: "data/review.sqlite"       # per Umgebungsvariable PR_REVIEW_DB änderbar

datenlage:
  ausgabe: "berichte/datenlage.md"
  groessenklassen_m2: [2000, 5000, 10000, 20000]

# ============================================================================ Basiskarte (Protomaps, selbst gehostet)
basiskarte:
  # Auszug für die Metropolregion FrankfurtRheinMain (Näherung der Ausdehnung: Limburg bis Fulda-Rand,
  # Vogelsberg bis Bergstraße/Odenwald, Rheinhessen bis Aschaffenburg/Miltenberg) – [West, Süd, Ost, Nord] in WGS84
  bbox: [7.75, 49.38, 9.80, 50.85]
  minzoom: 0
  maxzoom: 15
  datei: "data/basemap/rhein-main.pmtiles"
  # Synthetischer Test-Auszug (scripts/erzeuge_testbasemap.py); wird nur genutzt, wenn der echte Auszug fehlt
  # und Testdaten angezeigt werden dürfen
  testdatei: "data/basemap/rhein-main-testdaten.pmtiles"
  metadatei: "data/basemap/rhein-main.meta.json"     # Build-Datum und Quelle, schreibt scripts/build_basemap.sh
  glyphen_verzeichnis: "data/basemap/glyphen"        # Schrift-Glyphen für Kartenlabels (lokal erzeugt)
  quelle: "https://build.protomaps.com"              # tägliche Protomaps-Builds (OpenStreetMap, ODbL)
  builds_liste: "https://build-metadata.protomaps.dev/builds.json"
  standardstil: stadt                                # stadt | schematisch
  attribution: "© OpenStreetMap-Mitwirkende, Daten unter ODbL · Kartenkacheln: Protomaps"
  # Eigene Ebenen erst ab sinnvollen Zoomstufen (kein Kartenrauschen)
  mindestzoom:
    bestand: 11
    flaechen: 13
  # Stufen der P+R-Symbolgröße nach Stellplätzen: [ab Stellplätzen, Durchmesser in px]
  bestand_symbolgroessen: [[0, 22], [150, 26], [400, 30], [800, 34]]
  # Kleiner Ausschnitt Frankfurt mit echten Straßen für die Demo-Ansicht (muss unter der Größengrenze bleiben)
  demo:
    datei: "data/basemap/frankfurt-demo.pmtiles"
    stufen:                         # ohne bbox = Gebiet der Basiskarte
      - {minzoom: 0, maxzoom: 8}                                         # ganze Region, grob
      - {bbox: [8.40, 49.98, 8.95, 50.30], minzoom: 9, maxzoom: 9}          # Umland
      - {bbox: [8.55, 50.04, 8.80, 50.19], minzoom: 10, maxzoom: 12}        # Frankfurt
      - {bbox: [8.60, 50.07, 8.75, 50.15], minzoom: 13, maxzoom: 13}        # Kernstadt
      - {bbox: [8.645, 50.100, 8.690, 50.118], minzoom: 14, maxzoom: 14}    # Hauptbahnhof/Innenstadt mit Straßennamen
    max_mb: 7.0      # eingebettet in die Demo-Seite (Grenze 16 MB inklusive aller übrigen Daten)
  # Ablage des fertigen Auszugs als GitHub-Release (Workflow .github/workflows/basiskarte.yml)
  release_tag: "basiskarte"
